
# ==========================================
# SOLARVISION AI - FRONTEND KUBERNETES
# React + TanStack Start + Nitro
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: solarvision-frontend
  namespace: solarvision
  labels:
    app: solarvision-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: solarvision-frontend

  template:
    metadata:
      labels:
        app: solarvision-frontend

    spec:
      containers:
        - name: frontend
          image: solarvision-frontend:k8s-v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8081"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: solarvision-frontend
  namespace: solarvision

spec:
  type: ClusterIP

  selector:
    app: solarvision-frontend

  ports:
    - name: http
      port: 8081
      targetPort: 8081
