
name: SolarVision AI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================
  # JOB 1 : PYTHON CODE QUALITY
  # ============================================
  code-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Check critical code errors
        run: |
          ruff check src --select E4,E7,E9,F63,F7,F82


  # ============================================
  # JOB 2 : FASTAPI AUTOMATED TESTS
  # ============================================
  api-tests:
    name: FastAPI Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install pytest httpx

      - name: Run FastAPI tests
        run: |
          python -m pytest -v tests

  frontend:
    name: Frontend Quality and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test

      - name: Build standalone frontend
        run: bun run build
        env:
          NITRO_PRESET: node_server


  # ============================================
  # JOB 3 : DOCKER IMAGE BUILD
  # ============================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - code-quality
      - api-tests
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build SolarVision Docker image
        run: |
          docker build -t solarvision-api:ci .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build frontend Docker image
        run: docker build -t solarvision-frontend:ci frontend
