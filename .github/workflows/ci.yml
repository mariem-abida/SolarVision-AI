
name: SolarVision AI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  code-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Check critical code errors
        run: ruff check src --select E4,E7,E9,F63,F7,F82

  api-tests:
    name: FastAPI Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install API and test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run API tests
        run: python -m pytest -v tests/test_api_contract.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t solarvision-api:ci .
