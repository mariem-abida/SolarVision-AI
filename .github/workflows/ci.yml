
name: SolarVision AI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================
  # JOB 1 : PYTHON CODE QUALITY
  # ============================================
  code-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Check critical code errors
        run: |
          ruff check src --select E4,E7,E9,F63,F7,F82


  # ============================================
  # JOB 2 : FASTAPI AUTOMATED TESTS
  # ============================================
  api-tests:
    name: FastAPI Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install pytest httpx

      - name: Run FastAPI tests
        run: |
          python -m pytest -v tests/test_api_contract.py


  # ============================================
  # JOB 3 : DOCKER IMAGE BUILD
  # ============================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - code-quality
      - api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build SolarVision Docker image
        run: |
          docker build -t solarvision-api:ci .
