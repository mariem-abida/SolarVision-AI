name: SolarVision AI CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Validation only: no registry push, credentials, deployment or DVC transfer.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  YOLO_OFFLINE: "true"
  HF_HUB_OFFLINE: "1"

jobs:
  code-quality:
    name: Python Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.5
      - name: Check Python syntax
        run: python -m compileall -q src tests scripts
      - name: Check critical Python errors
        run: python -m ruff check src tests scripts --select E4,E7,E9,F63,F7,F82

  api-tests:
    name: FastAPI Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            constraints-cpu.txt
      - name: Install constrained CPU runtime and test tools
        run: |
          python -m pip install pip==26.3 setuptools==79.0.1 wheel==0.46.3
          python -m pip install --constraint constraints-cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-ci.txt
          python -m pip check
      - name: Confirm CPU-only package selection
        run: python -c "import torch,torchvision; assert torch.__version__ == '2.15.0+cpu'; assert torchvision.__version__ == '0.29.2+cpu'; assert not torch.cuda.is_available(); print(torch.__version__, torchvision.__version__)"
      - name: Verify public snapshot without private data sources
        run: python scripts/check_public_snapshot.py --require-clean-source
      - name: Check publication safety of tracked files
        run: python scripts/check_publication_safety.py --tracked
      - name: Run isolated FastAPI and metadata unit tests
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "${{ runner.temp }}/solarvision-pytest"
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/solarvision-ultralytics
          SOLARVISION_HISTORY_DB: ${{ runner.temp }}/solarvision-ci.sqlite3

  frontend:
    name: Frontend Quality and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run typecheck
      - name: Lint frontend
        run: bun run lint
      - name: Test frontend without models or live services
        run: bun run test:unit
      - name: Build standalone frontend
        run: bun run build
        env:
          NITRO_PRESET: node_server

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [code-quality, api-tests, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
      - name: Validate Compose without launching services
        run: docker compose config --quiet
      - name: Build CPU API image from public sources only
        run: docker build --pull=false -t solarvision-api:ci .
      - name: Build standalone frontend image
        run: docker build --pull=false -t solarvision-frontend:ci frontend
      - name: Smoke isolated images without weights or network
        run: python scripts/ci_smoke_images.py --api-image solarvision-api:ci --frontend-image solarvision-frontend:ci
